name: Deobfuscate ViolenceDistrict (improved)

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/ViolenceDistrict.lua'

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install regex

      - name: Create output directory
        run: mkdir -p output

      - name: Run improved deobfuscator script
        run: |
          python3 scripts/deobfuscate_violence_district_improved.py games/ViolenceDistrict.lua output

      - name: List outputs
        run: ls -R output || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violence-district-deobfuscated
          path: output