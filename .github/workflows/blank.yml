name: Deobfuscate Lua

on:
  push:
    paths:
      - '**.lua'
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4.4"

      - name: Create deobfuscator
        run: |
          cat > deobfuscator.lua << 'EOF'
          local function bxor(a,b)
            local r=0
            for i=0,7 do
              local abit=(a>>i)&1
              local bbit=(b>>i)&1
              if abit~=bbit then r=r|(1<<i) end
            end
            return r
          end
          local function read_file(p)
            local f=io.open(p,"rb")
            if not f then return nil end
            local c=f:read("*all")
            f:close()
            return c
          end
          local function write_file(p,c)
            local f=io.open(p,"wb")
            if not f then return false end
            f:write(c)
            f:close()
            return true
          end
          local function load_chunk(str)
            local fn, err = load(str, "=(string)", "t", {})
            if not fn then
              fn, err = loadstring(str)
            end
            return fn, err
          end
          local function extract_and_decode_bx1(code)
            local s=code:find("bx1%s*=%s*{")
            if not s then return nil end
            local dep=0
            local i=s
            local bs=nil
            while i<=#code do
              local ch=code:sub(i,i)
              if ch=="{" then
                if dep==0 then bs=i end
                dep=dep+1
              elseif ch=="}" then
                dep=dep-1
                if dep==0 and bs then
                  local tbl=code:sub(bs,i)
                  local f, err = load_chunk("return " .. tbl)
                  if not f then return nil end
                  local bx1=f()
                  if type(bx1)~="table" then return nil end
                  local dec={}
                  for idx,s in ipairs(bx1) do
                    local parts={}
                    for j=1,#s do
                      parts[j]=string.char(bxor(string.byte(s,j),129))
                    end
                    dec[idx]=table.concat(parts)
                  end
                  return dec
                end
              end
              i=i+1
            end
            return nil
          end
          local function decode_vWOWZo(code)
            local s=code:find("vWOWZo%s*=%s*{")
            if not s then return nil end
            local dep=0
            local i=s
            local bs=nil
            while i<=#code do
              local ch=code:sub(i,i)
              if ch=="{" then
                if dep==0 then bs=i end
                dep=dep+1
              elseif ch=="}" then
                dep=dep-1
                if dep==0 and bs then
                  local tbl=code:sub(bs,i)
                  local f, err = load_chunk("return " .. tbl)
                  if not f then return nil end
                  local arr=f()
                  if type(arr)~="table" then return nil end
                  local dec={}
                  for idx,s in ipairs(arr) do
                    local parts={}
                    for j=1,#s do
                      parts[j]=string.char(bxor(string.byte(s,j),129))
                    end
                    dec[idx]=table.concat(parts)
                  end
                  return dec
                end
              end
              i=i+1
            end
            return nil
          end
          local function process_file(filepath)
            local code=read_file(filepath)
            if not code then return false end
            local dec1=extract_and_decode_bx1(code)
            local new_code=code
            if dec1 then
              for idx,str in ipairs(dec1) do
                local pat="10zpX%["..idx.."%]"
                local rep='"' .. str:gsub('"', '\\"'):gsub('%%', '%%%%') .. '"'
                new_code=new_code:gsub(pat,rep)
              end
            end
            local dec2=decode_vWOWZo(new_code)
            if dec2 then
              for idx,str in ipairs(dec2) do
                local pat="lHnUu%["..idx.."%]"
                local rep='"' .. str:gsub('"', '\\"'):gsub('%%', '%%%%') .. '"'
                new_code=new_code:gsub(pat,rep)
              end
            end
            if new_code~=code then
              local outpath = filepath:gsub("%.lua$", ".deobf.lua")
              write_file(outpath, new_code)
              print("Deobfuscated: "..filepath.." -> "..outpath)
              return true
            else
              print("Skipped (not obfuscated): "..filepath)
              return false
            end
          end
          local handle=io.popen("find . -type f -name '*.lua' -not -path './.luarocks/*' -not -path './.git/*' -not -path './deobfuscator.lua'")
          if not handle then print("Failed to find files") os.exit(1) end
          for file in handle:lines() do
            local path=file:gsub("^%.%/","")
            process_file(path)
          end
          handle:close()
          EOF

      - name: Run deobfuscator
        run: lua deobfuscator.lua

      - name: Install StyLua
        run: cargo install stylua
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Format deobfuscated files
        run: |
          stylua --indent-type tabs --indent-width 4 --line-endings Unix --quote-style AutoPreferDouble --call-parentheses none --luau --glob '**.deobf.lua' . || true

      - name: Upload deobfuscated files
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-lua
          path: '**/*.deobf.lua'
          if-no-files-found: error
