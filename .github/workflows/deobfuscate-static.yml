name: Deobfuscate Static (XOR decoder)

on:
  workflow_dispatch:
  push:
    paths:
      - 'games/ViolenceDistrict.lua'
      - 'deobfuscate_static.py'
      - 'deobfuscate_pass2.py'

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Pass 1 - Decode string table
        run: |
          mkdir -p scripts
          python3 deobfuscate_static.py games/ViolenceDistrict.lua scripts/pass1.lua

      - name: Pass 2 - Clean variables and ENV calls
        run: |
          python3 deobfuscate_pass2.py scripts/pass1.lua scripts/ViolenceDistrict.lua
          rm scripts/pass1.lua

      - name: Install StyLua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua

      - name: Format deobfuscated file
        run: |
          if [ -f scripts/ViolenceDistrict.lua ]; then
            stylua \
              --indent-type Tabs \
              --indent-width 4 \
              --line-endings Unix \
              --quote-style AutoPreferDouble \
              --call-parentheses None \
              --luau \
              scripts/ViolenceDistrict.lua || true
          fi

      - name: Show preview
        run: |
          if [ -f scripts/ViolenceDistrict.lua ]; then
            echo "=== First 100 lines ==="
            head -100 scripts/ViolenceDistrict.lua
            echo ""
            echo "=== File stats ==="
            wc -l scripts/ViolenceDistrict.lua
            wc -c scripts/ViolenceDistrict.lua
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-violence-district
          path: scripts/
